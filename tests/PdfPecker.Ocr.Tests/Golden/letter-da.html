<p>København, den 3. november 2026</p>
<p>Kære Søren Ærtebjerg</p>
<p>Tak for dit brev og for de flotte æbler fra haven.<br>Vi glæder os til at se jer på Fanø i næste måned.<br>Husk at tage varmt tøj med, for vinden er kold<br>ved stranden, og færgen sejler kun to gange om dagen.</p>
<p>Mange hilsner fra Åse og Bjørn</p>
