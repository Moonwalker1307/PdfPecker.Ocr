name: Performance

# Runs the benchmark on the branch the run is started on (main by default) and keeps its results as an artifact, so
# runs can be compared over time. It is on demand for now; a nightly schedule and an automatic comparison with earlier
# runs come once bench/PdfPecker.Ocr.Benchmarks has settled, as in PdfPecker's perf.yml. Hosted runners come in several
# processor models, so only runs on the same processor are comparable, and a change of your own is measured with
# bench/compare-versions.sh on one machine instead.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner to measure on (macos-latest is Apple Silicon)
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
        default: ubuntu-latest

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  benchmark:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      # The code measured is that of the branch the run was started on, main unless another is chosen, so a branch's
      # bench or kernel change can be timed on a runner before it merges.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props

      - name: Check that the benchmark exists
        id: bench
        run: |
          if [ -f bench/PdfPecker.Ocr.Benchmarks/PdfPecker.Ocr.Benchmarks.csproj ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::bench/PdfPecker.Ocr.Benchmarks is not in the repository yet; nothing to run."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.bench.outputs.present == 'true'
        run: dotnet build -c Release bench/PdfPecker.Ocr.Benchmarks

      # The GC sizes its youngest generation from the processor's cache, so without a fixed size the allocation-heavy
      # cases collect more often on some runner models than on others and their times stop being comparable.
      - name: Run the benchmark
        if: steps.bench.outputs.present == 'true'
        env:
          DOTNET_GCgen0size: "0x4000000"
        run: |
          cpu=$(sysctl -n machdep.cpu.brand_string 2>/dev/null || grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)
          dotnet bench/PdfPecker.Ocr.Benchmarks/bin/Release/net10.0/PdfPecker.Ocr.Benchmarks.dll --perf perf.json | tee perf-summary.md
          { echo "## Performance"; echo; echo "Processor: $cpu"; echo; cat perf-summary.md; } >> "$GITHUB_STEP_SUMMARY"

      # The time of each network layer by layer, at one thread and on all cores, shows where a processor family spends
      # its time (on ARM the kernels take their 128-bit NEON paths).
      - name: Time the networks layer by layer
        if: steps.bench.outputs.present == 'true'
        env:
          DOTNET_GCgen0size: "0x4000000"
        run: |
          dotnet build -c Release -p:OcrInternals=true -o layers-bin bench/PdfPecker.Ocr.Benchmarks
          { dotnet layers-bin/PdfPecker.Ocr.Benchmarks.dll layers --threads 1 --runs 3 --top 25
            dotnet layers-bin/PdfPecker.Ocr.Benchmarks.dll layers --runs 3 --top 25
            dotnet layers-bin/PdfPecker.Ocr.Benchmarks.dll stages --threads 1
            dotnet layers-bin/PdfPecker.Ocr.Benchmarks.dll stages; } | tee layers.txt
          { echo; echo "## Layers and stages"; echo; echo '```'; cat layers.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.bench.outputs.present == 'true'
        with:
          name: perf-results
          path: |
            perf.json
            perf-summary.md
            layers.txt
          retention-days: 90
